name: Snyk Security Scan

on:
  push:
    branches: [ unbt, main, master ]
  pull_request:
    branches: [ unbt, main, master ]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  snyk-scan:
    runs-on: ubuntu-latest
    environment: snyk

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack and activate Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate
          yarn --version

      - name: Verify Snyk token exists
        run: |
          if [ -z "${{ secrets.SNYK_TOKEN }}" ]; then
            echo "ERROR: SNYK_TOKEN secret is not set"
            exit 1
          else
            echo "SNYK_TOKEN secret is configured"
          fi

      - name: Install Node dependencies
        if: hashFiles('package.json') != ''
        run: yarn install --immutable

      - name: Run Snyk Open Source scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --all-projects --severity-threshold=medium

      - name: Run Snyk Code scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: code test
          args: --severity-threshold=medium

      - name: Run Snyk Monitor
        if: github.event_name == 'push' && (github.ref == 'refs/heads/unbt' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor
          args: --all-projects
